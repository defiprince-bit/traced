<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traced · circuit lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet"><style>
/* Traced design tokens: source of truth (mirrored in traced-steering.md) */
:root{
  /* surfaces: a die under a microscope */
  --substrate:#0B0A10;     /* page background */
  --wafer:#13111A;         /* cards, panels */
  --die:#1B1824;           /* raised: inputs, nodes, table head */
  --die-hi:#24202F;        /* hover on raised */
  --etch:#2C2838;          /* hairline borders */
  --etch-strong:#433C54;   /* focus-adjacent borders, dividers on raised */
  --grid:rgba(227,146,95,.05); /* faint PCB grid lines */
  /* text: silkscreen */
  --silk:#EEEAF3;          /* primary text  15.9:1 on wafer */
  --silk-2:#B9B2C7;        /* secondary     8.9:1 */
  --silk-3:#8D869C;        /* footnotes, labels 5.2:1 */
  /* copper: traces, brand, primary action */
  --copper:#E8975F;        /* 7.9:1 on wafer */
  --copper-deep:#C0723F;   /* pressed */
  --copper-dim:#7A4A2E;    /* idle traces in the tree */
  --copper-ink:#1E0F05;    /* text on copper 8.6:1 */
  --copper-veil:rgba(232,151,95,.12);
  /* logic */
  --signal:#B8F26B;        /* pass, logic 1, live pulse  13.6:1 */
  --signal-ink:#132205;
  --signal-veil:rgba(184,242,107,.12);
  --low:#4E475F;           /* logic 0 pad */
  /* verdicts */
  --alert:#FF6E9C;         /* silent copy, mismatch  6.6:1 */
  --alert-ink:#2A0613;
  --alert-veil:rgba(255,110,156,.10);
  --original:#F3C969;      /* likely original (gold pad)  11.4:1 */
  --original-veil:rgba(243,201,105,.10);
  --caution:#F3C969;       /* errors use alert, warnings use original */
  /* class badges (Traced heuristics, see classify.ts) */
  --cls-toy:#A79FB6;       /* 1–3 gates, no REF */
  --cls-wrapper:#B9A3FF;   /* pure REF */
  --cls-library:#E8975F;   /* cited by others (copper: it's a source) */
  --cls-miner:#F3C969;     /* flat netlist ≥ 1,000 gates */
  --cls-composed:#8EC5FF;  /* own gates + REF */
  --cls-flat:#B9B2C7;      /* own gates, no REF */
  /* type */
  --font-display:"Newsreader", "Iowan Old Style", Georgia, serif; /* italic, opsz 36–72 */
  --font-body:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --text-2xs:11px; --text-xs:12px; --text-sm:13px; --text-base:15px; --text-md:17px;
  --text-lg:20px; --text-xl:28px; --text-2xl:40px; --text-hero:64px;
  --leading-tight:1.08; --leading-snug:1.3; --leading-body:1.55;
  --track-label:.08em;     /* mono uppercase labels */
  /* spacing (4px base) */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px;
  --s-8:32px; --s-10:40px; --s-12:48px; --s-16:64px; --s-20:80px;
  /* radii: chips are square-ish */
  --r-xs:3px; --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  /* tree geometry */
  --node-w:148px; --node-h:56px; --target-w:220px; --target-h:96px;
  --trace-w:2px; --via-r:4px; --bus-gap:28px;
  /* elevation */
  --shadow-card:inset 0 1px 0 rgba(255,255,255,.035), 0 24px 60px -30px rgba(0,0,0,.8);
  --shadow-pop:0 18px 50px -12px rgba(0,0,0,.75);
  --glow-copper:0 0 0 1px rgba(232,151,95,.45), 0 0 24px rgba(232,151,95,.18);
  --glow-signal:0 0 10px rgba(184,242,107,.55);
  --ring:0 0 0 2px var(--substrate), 0 0 0 4px var(--copper);
  /* motion: opacity + transform only */
  --d-instant:80ms; --d-fast:140ms; --d-base:220ms; --d-slow:420ms; --d-pulse:900ms; --d-idle:3200ms;
  --stagger:50ms;
  --ease-out:cubic-bezier(.2,.7,.2,1);
  --ease-trace:cubic-bezier(.45,0,.2,1);
}

/* Traced base + components (mock implementation of traced-steering.md) */
*{box-sizing:border-box}
html,body{margin:0;background:var(--substrate);color:var(--silk);font:400 var(--text-base)/var(--leading-body) var(--font-body);-webkit-font-smoothing:antialiased}
a{color:inherit}
.mono{font-family:var(--font-mono);font-feature-settings:"zero" 1}
.label{font:500 var(--text-2xs)/1 var(--font-mono);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--silk-3)}
.foot{font-size:var(--text-xs);color:var(--silk-3);line-height:1.5}
.it{font-family:var(--font-display);font-style:italic;font-weight:400}
.pcb-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 80%)}

/* top bar */
.topbar{position:relative;z-index:2;display:flex;align-items:center;gap:var(--s-4);height:64px;padding:0 var(--s-8);border-bottom:1px solid var(--etch)}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.brand .mark{width:28px;height:28px}
.brand b{font:italic 500 26px/1 var(--font-display);letter-spacing:-.01em;color:var(--silk)}
.brand small{font:400 var(--text-xs)/1 var(--font-body);color:var(--silk-3);margin-left:2px;padding-top:6px}
.spacer{flex:1}
.nav-link{color:var(--silk-2);text-decoration:none;font-size:var(--text-sm)}
.nav-link:hover{color:var(--silk)}
.ro-pill{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 12px;border:1px solid var(--etch);border-radius:var(--r-pill);font:500 var(--text-xs)/1 var(--font-mono);color:var(--silk-2)}
.ro-pill i{width:7px;height:7px;border-radius:2px;background:var(--signal);box-shadow:var(--glow-signal)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--etch-strong);background:var(--die);color:var(--silk);font:500 var(--text-sm)/1 var(--font-body);text-decoration:none;cursor:pointer;transition:transform var(--d-fast) var(--ease-out),opacity var(--d-fast)}
.btn:hover{background:var(--die-hi)}
.btn:active{transform:translateY(1px)}
.btn-copper{background:var(--copper);border-color:var(--copper);color:var(--copper-ink);font-weight:600}
.btn-copper:hover{background:#F0A673}
.btn-lg{height:52px;padding:0 22px;font-size:var(--text-base)}
.btn:focus-visible,.field:focus-within,.chip:focus-visible,a:focus-visible{outline:none;box-shadow:var(--ring)}
.kbd{font:500 var(--text-2xs)/1 var(--font-mono);padding:4px 6px;border-radius:4px;background:rgba(0,0,0,.18)}

/* lookup bar */
.lookup{display:flex;gap:0;align-items:stretch;border:1px solid var(--etch-strong);border-radius:var(--r-md);background:var(--die);padding:5px;box-shadow:var(--shadow-card)}
.lookup .proc{display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 16px 0 12px;border-right:1px solid var(--etch);min-width:210px;cursor:pointer}
.lookup .proc .v{display:flex;align-items:center;gap:8px;font:500 var(--text-base)/1 var(--font-body);color:var(--silk)}
.lookup .proc .v .mono{font-size:var(--text-xs);color:var(--silk-3);font-weight:400}
.lookup .cid{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:0 16px}
.lookup .cid .hash{font:500 22px/1 var(--font-mono);color:var(--copper)}
.lookup .cid input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--silk);font:500 20px/1 var(--font-mono);outline:none}
.lookup .cid input::placeholder{color:var(--silk-3);font-weight:400}
.chev{width:12px;height:12px;color:var(--silk-3)}

/* example chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 10px;border-radius:var(--r-sm);border:1px solid var(--etch);background:var(--wafer);color:var(--silk-2);font-size:var(--text-sm);text-decoration:none;transition:transform var(--d-fast) var(--ease-out),border-color var(--d-fast)}
.chip:hover{border-color:var(--copper-dim);color:var(--silk);transform:translateY(-1px)}
.chip .mono{color:var(--copper);font-weight:600}
.chip .pin{width:6px;height:6px;border-radius:1.5px;background:var(--copper)}

/* cards */
.card{position:relative;background:var(--wafer);border:1px solid var(--etch);border-radius:var(--r-lg);box-shadow:var(--shadow-card)}
.card-h{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-5) var(--s-6) 0}
.card-h h2{margin:0;font:italic 400 var(--text-lg)/1.1 var(--font-display);color:var(--silk)}
.card-h .label{margin-left:auto}
.card-b{padding:var(--s-4) var(--s-6) var(--s-6)}

/* class badges: a tiny DIP package */
.badge{--c:var(--cls-flat);display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 12px 0 8px;border-radius:var(--r-xs);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);color:var(--c);font:600 var(--text-xs)/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.badge .pkg{position:relative;width:12px;height:14px;border-radius:2px;background:var(--c)}
.badge .pkg::before,.badge .pkg::after{content:"";position:absolute;top:2px;bottom:2px;width:2px;background:repeating-linear-gradient(var(--c) 0 2px,transparent 2px 4px)}
.badge .pkg::before{left:-4px}.badge .pkg::after{right:-4px}
.badge.toy{--c:var(--cls-toy)}.badge.wrapper{--c:var(--cls-wrapper)}.badge.library{--c:var(--cls-library)}
.badge.miner{--c:var(--cls-miner)}.badge.composed{--c:var(--cls-composed)}.badge.flat{--c:var(--cls-flat);border-style:dashed}
.badge.sm{height:22px;font-size:10px;padding:0 8px 0 6px;gap:7px}.badge.sm .pkg{width:9px;height:11px}

/* status marks */
.mk{display:inline-flex;align-items:center;gap:6px;font:600 var(--text-xs)/1 var(--font-mono)}
.mk.pass{color:var(--signal)}.mk.fail{color:var(--alert)}
.mk svg{width:14px;height:14px}
.bit{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px;font:600 var(--text-sm)/1 var(--font-mono);background:var(--die);color:var(--silk-3);border:1px solid var(--etch)}
.bit.on{background:var(--signal-veil);color:var(--signal);border-color:rgba(184,242,107,.4)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>
<style>
.topbar .lookup{flex:0 1 640px;margin:0 auto;padding:3px;box-shadow:none}
.topbar .lookup .proc{min-width:170px;padding:0 12px 0 10px;gap:3px}
.topbar .lookup .proc .v{font-size:var(--text-sm)}
.topbar .lookup .cid .hash{font-size:18px}.topbar .lookup .cid input{font-size:17px}
.topbar .lookup .btn{height:38px}
.topbar .spacer{display:none}
.page{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:28px 32px 56px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px}
.span2{grid-column:1/-1}
.crumbs{display:flex;align-items:center;gap:10px;justify-content:space-between}
.ex-tag{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 10px;border-radius:var(--r-xs);border:1px dashed var(--etch-strong);font:500 var(--text-2xs)/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--silk-3)}
/* header card */
.hd{padding:24px 28px 0}
.hd .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hd .cidbig{font:600 44px/1 var(--font-mono);letter-spacing:-.02em;color:var(--silk)}
.hd .cidbig span{color:var(--copper)}
.hd .on{font-size:var(--text-sm);color:var(--silk-3)}
.hd h1{margin:14px 0 6px;font:italic 400 var(--text-xl)/1.18 var(--font-display);color:var(--silk);max-width:720px}
.hd p.sub{margin:0;color:var(--silk-2);max-width:680px}
.facts{display:grid;grid-template-columns:1fr .8fr 1.1fr 1.3fr 1fr;margin-top:22px;border-top:1px solid var(--etch)}
.fact{padding:14px 16px 18px 0;display:flex;flex-direction:column;gap:8px;min-width:0}
.fact+.fact{padding-left:16px;border-left:1px solid var(--etch)}
.fact .v{font:500 var(--text-sm)/1.3 var(--font-mono);color:var(--silk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fact .v a{color:var(--copper);text-decoration:none}.fact .v a:hover{text-decoration:underline}
.fact .v small{color:var(--silk-3);font-size:var(--text-xs)}
.fact .v2{font:400 var(--text-xs)/1.2 var(--font-mono);color:var(--silk-3);white-space:nowrap}
.fact .v.none{color:var(--silk-3);font-family:var(--font-body);font-style:normal}
/* copy check */
.cc{display:flex;flex-direction:column}
.cc .verdict{margin:14px 24px 0;padding:16px 16px 16px 18px;border-radius:var(--r-md);border:1px solid var(--etch);background:var(--die);position:relative;overflow:hidden}
.cc .verdict::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--vc,var(--silk-3))}
.cc .verdict .vt{display:flex;align-items:center;gap:10px;font:600 var(--text-md)/1.2 var(--font-body);color:var(--vc,var(--silk))}
.cc .verdict .vt svg{width:18px;height:18px;flex:none}
.cc .verdict p{margin:8px 0 0;color:var(--silk-2);font-size:var(--text-sm)}
.cc .verdict.copy{--vc:var(--alert);background:linear-gradient(90deg,var(--alert-veil),transparent 70%),var(--die);border-color:rgba(255,110,156,.35)}
.cc .verdict.orig{--vc:var(--original);background:linear-gradient(90deg,var(--original-veil),transparent 70%),var(--die);border-color:rgba(243,201,105,.35)}
.cc .verdict.clean{--vc:var(--signal)}
.cc .verdict.cites{--vc:var(--cls-composed)}
.twins{list-style:none;margin:14px 24px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.twins li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--etch);font-size:var(--text-sm)}
.twins li .mono{font-weight:600}
.twins li .who{color:var(--silk-3);font:400 var(--text-xs)/1.3 var(--font-mono)}
.twins li.me{border-color:var(--etch-strong);background:var(--die)}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-xs);font:600 10px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tag.orig{color:var(--original);background:var(--original-veil);border:1px solid rgba(243,201,105,.4)}
.tag.copy{color:var(--alert);background:var(--alert-veil);border:1px solid rgba(255,110,156,.4)}
.tag.you{color:var(--silk-2);border:1px solid var(--etch-strong)}
.cc .card-b{margin-top:auto}
/* lineage */
.lin .card-h{padding-bottom:4px}
.legend{display:flex;gap:16px;align-items:center;margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-xs);color:var(--silk-3)}
.legend i{display:inline-block;width:18px;height:2px;background:var(--copper)}
.legend i.tw{background:repeating-linear-gradient(90deg,var(--alert) 0 4px,transparent 4px 7px)}
.legend i.via{width:9px;height:9px;border-radius:50%;border:1.6px solid var(--copper);background:var(--substrate)}
.tree{position:relative;margin:4px 24px 24px}
.tree svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tree path.tr{fill:none;stroke:var(--copper-dim);stroke-width:var(--trace-w)}
.tree path.tr.lit{stroke:var(--copper)}
.tree path.tw{fill:none;stroke:var(--alert);stroke-width:1.6;stroke-dasharray:5 5}
.tree path.tw.orig{stroke:var(--original)}
.tree .via-ring{fill:var(--wafer);stroke:var(--copper);stroke-width:1.6}.tree .via-hole{fill:var(--copper)}
.tree .bus{fill:var(--copper)}
.tree .stub{fill:none;stroke:var(--etch-strong);stroke-width:2;stroke-dasharray:2 5;stroke-linecap:round}
.row-label{position:absolute;left:0;display:flex;align-items:center;gap:10px}
.row-label b{font:600 var(--text-xs)/1 var(--font-mono);color:var(--silk-2)}
.node{position:absolute;width:var(--node-w);height:var(--node-h);display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-content:center;gap:4px 8px;padding:0 12px 0 14px;border-radius:var(--r-sm);border:1px solid var(--etch-strong);background:var(--die);text-decoration:none;color:var(--silk);transition:transform var(--d-fast) var(--ease-out),border-color var(--d-fast);opacity:0;animation:nodeIn var(--d-slow) var(--ease-out) forwards}
.node::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 2px 2px 0;background:var(--c,var(--silk-3))}
.node:hover{transform:translateY(-2px);border-color:var(--copper)}
.node .nid{font:600 var(--text-md)/1 var(--font-mono)}
.node .nid small{font:500 var(--text-2xs)/1 var(--font-mono);color:var(--silk-3);margin-right:4px;letter-spacing:.02em}
.node .nm{grid-column:1;font-size:var(--text-xs);color:var(--silk-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .uses{grid-row:1/3;grid-column:2;align-self:center;font:600 var(--text-sm)/1 var(--font-mono);color:var(--copper)}
.node.lib{--c:var(--cls-library)}.node.wrapper{--c:var(--cls-wrapper)}.node.toy{--c:var(--cls-toy)}.node.miner{--c:var(--cls-miner)}.node.composed{--c:var(--cls-composed)}.node.flat{--c:var(--cls-flat)}
.node.more{border-style:dashed;background:transparent;grid-template-columns:1fr;cursor:pointer}
.node.more::before{display:none}
.node.more .nid{color:var(--copper)}
.node.twin{border-color:rgba(255,110,156,.55)}
.node.twin.orig{border-color:rgba(243,201,105,.6)}
.node.twin .nm{color:var(--silk-2)}
.target{position:absolute;width:var(--target-w);height:var(--target-h);border-radius:var(--r-md);border:1.5px solid var(--copper);background:linear-gradient(180deg,var(--copper-veil),transparent 70%),var(--die);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:var(--glow-copper);opacity:0;animation:nodeIn var(--d-slow) var(--ease-out) forwards}
.target .label{color:var(--copper)}
.target b{font:600 30px/1 var(--font-mono)}
.target .pad{position:absolute;right:12px;top:12px;width:12px;height:10px;border-radius:2px;background:var(--signal);opacity:.25}
.target.lit .pad{animation:padOn var(--d-slow) var(--ease-out) forwards}
.pin{position:absolute;width:6px;height:9px;background:var(--copper);border-radius:1px}
.empty-note{position:absolute;font-size:var(--text-sm);color:var(--silk-3);transform:translateX(-50%);white-space:nowrap}
.empty-note b{color:var(--silk-2);font-weight:500}
.tw-label{position:absolute;font:600 10px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--alert);background:var(--wafer);padding:3px 6px;transform:translate(-50%,-50%)}
.tw-label.orig{color:var(--original)}
@keyframes nodeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes padOn{to{opacity:1}}
/* mobile list tree */
.tlist{display:none;margin:4px 16px 18px}
.tlist h4{margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.tlist ul{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--copper-dim)}
.tlist li{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;margin:6px 0;border-radius:var(--r-sm);border:1px solid var(--etch);background:var(--die)}
.tlist li::before{content:"";position:absolute;left:-15px;top:50%;width:14px;height:2px;background:var(--copper-dim)}
.tlist li .mono{font-weight:600}
.tlist li .nm{flex:1;color:var(--silk-3);font-size:var(--text-xs);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlist li .u{font:600 var(--text-xs)/1 var(--font-mono);color:var(--copper)}

function tracePath(pts,r=6){let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const [x,y]=pts[i];if(i<pts.length-1){const [px,py]=pts[i-1],[nx,ny]=pts[i+1];const dx1=Math.sign(x-px),dy1=Math.sign(y-py),dx2=Math.sign(nx-x),dy2=Math.sign(ny-y);const rr=Math.min(r,Math.abs(x-px)+Math.abs(y-py),Math.abs(nx-x)+Math.abs(ny-y))/1;d+=` L${x-dx1*rr} ${y-dy1*rr} Q${x} ${y} ${x+dx2*rr} ${y+dy2*rr}`;}else d+=` L${x} ${y}`;}return d;}

 const T=document.getElementById('tree');const W=T.clientWidth;if(!W)return;
 const nw=148,nh=56,tw=220,th=96,gap=22;
 const P=v.parents, C=v.children, hasP=P.length>0, hasC=C.length>0;
 const yP=34, yT=hasP?yP+nh+110:70, yC=yT+th+(hasC?110:0)+ (hasC?0:0);
 const H=hasC?yC+nh+8:yT+th+92; T.style.height=H+'px';
 const cx=W/2, tx=cx-tw/2;
 let html='',svg=`<svg viewBox="0 0 ${W} ${H}" id="tsvg"></svg>`;
 html+=`<div class="row-label" style="top:0"><span class="label">Reuses</span><b>${hasP?`${P.length} circuit${P.length>1?'s':''} · ${P.reduce((a,p)=>a+p[1],0)} REF${P.reduce((a,p)=>a+p[1],0)>1?'s':''}`:'nothing'}</b></div>`;
 T.innerHTML=svg;const S=T.querySelector('svg');
 // target
 const target=document.createElement('div');target.className='target';target.style.cssText=`left:${tx}px;top:${yT}px;animation-delay:120ms`;
 target.innerHTML=`<span class="pad"></span><span class="label">This circuit</span><b>#${v.id}</b>${badge(v.k,true)}`;
 // parents
 const pulses=[];
 if(hasP){
  const vis=P.slice(0,MAXN), more=P.length-vis.length, slots=vis.length+(more?1:0);
  const totalW=slots*nw+(slots-1)*gap*2; let x0=cx-totalW/2;
  const pinsTotal=vis.reduce((a,p)=>a+p[1],0), pinStep=Math.min(14,(tw-40)/Math.max(1,pinsTotal)), pinsW=pinStep*(pinsTotal-1);
  let pinCursor=cx-pinsW/2;
  const centers=vis.map((p,i)=>x0+i*(nw+gap*2)+nw/2);
  // pin groups
  const groups=vis.map(p=>{const g={from:pinCursor,to:pinCursor+pinStep*(p[1]-1)};pinCursor+=pinStep*p[1];g.mid=(g.from+g.to)/2;return g;});
  // levels: outer turns lower
  const busTop=yP+nh+26, busBot=yT-30; const n=vis.length;
  vis.forEach((p,i)=>{
   const px=centers[i], g=groups[i];
   html+=nodeHTML(p[0],p[1],px-nw/2,yP,200+i*60);
   const dist=Math.abs(i-(n-1)/2), maxd=(n-1)/2||1;
   const L=busTop+(busBot-busTop)*(dist/maxd);
   const pts=Math.abs(px-g.mid)<2?[[px,yP+nh],[px,yT]]:[[px,yP+nh],[px,L],[g.mid,L],[g.mid,yT-10]];
   if(pts.length>2)pts.push([g.mid,yT]);
   el('path',{d:tracePath(pts,8),class:'tr lit'},S);
   if(pts.length>2)via(S,px,L);
   // bus bar over the pin group
   if(p[1]>1)el('rect',{x:g.from-3,y:yT-12,width:g.to-g.from+6,height:3,rx:1.5,class:'bus'},S);
   for(let k=0;k<p[1];k++){html+=`<span class="pin" style="left:${g.from+k*pinStep-3}px;top:${yT-9}px"></span>`;}
   if(p[1]>1)for(let k=0;k<p[1];k++)el('path',{d:`M${g.from+k*pinStep} ${yT-10} V${yT}`,class:'tr lit'},S);
   pulses.push(pts);
  });
  if(more){const mx=x0+vis.length*(nw+gap*2);html+=`<div class="node more" style="left:${mx}px;top:${yP}px"><span class="nid">+${more} more</span><span class="nm">show all parents</span></div>`;}
 }else{
  html+=`<div class="empty-note" style="left:${cx}px;top:${yT-50}px"><b>Built from scratch.</b> #${v.id} doesn’t REF any circuit.</div>`;
  el('path',{d:`M${cx} ${yT-22} V${yT}`,class:'stub'},S);
 }
 // twins (side nodes)
 if(v.twins){const o=v.twins.orig;const ox=tx-nw-150, oy=yT+th/2-nh/2;
  html+=nodeHTML(o,0,ox,oy,300,'twin orig');
  el('path',{d:`M${ox+nw} ${yT+th/2} H${tx}`,class:'tw orig'},S);
  html+=`<span class="tw-label orig" style="left:${(ox+nw+tx)/2}px;top:${yT+th/2-14}px">Likely original</span><span class="tw-label" style="left:${(ox+nw+tx)/2}px;top:${yT+th/2+14}px">Same bytes · no REF</span>`;
 }
 // children
 const cLabelY=hasC?yC-40:yT+th+30;
 if(hasC){
  const total=v.childrenTotal||C.length, vis=C.slice(0,MAXN), more=total-vis.length, slots=vis.length+(more?1:0);
  const totalW=slots*nw+(slots-1)*gap; let x0=cx-totalW/2; const n=slots;
  const pinStep=Math.min(16,(tw-40)/Math.max(1,slots-1)), pinsW=pinStep*(slots-1);
  const topL=yT+th+28, botL=yC-30;
  for(let i=0;i<slots;i++){
   const x=x0+i*(nw+gap)+nw/2, px=cx-pinsW/2+i*pinStep;
   const dist=Math.abs(i-(n-1)/2), maxd=(n-1)/2||1; const L=topL+(botL-topL)*(1-dist/maxd);
   const pts=[[px,yT+th],[px,L],[x,L],[x,yC]];
   el('path',{d:tracePath(pts,8),class:'tr'+(i<vis.length?' lit':'')},S); via(S,x,L);
   html+=`<span class="pin" style="left:${px-3}px;top:${yT+th}px"></span>`;
   if(i<vis.length){const c=vis[i];html+=`<a class="node lib" style="left:${x-nw/2}px;top:${yC}px;animation-delay:${500+i*50}ms;--c:var(--silk-3)" href="#"><span class="nid">${c[1]!=null?'#'+c[1]:''}${c[1]==null?'<small>'+c[0]+'</small>':''}</span><span class="nm">${c[1]!=null?'on '+c[0]:'first REF child'}</span></a>`;}
   else html+=`<div class="node more" style="left:${x-nw/2}px;top:${yC}px"><span class="nid">+${more} more</span><span class="nm">show all children</span></div>`;
   pulses.push(pts);
  }
  html+=`<div class="row-label" style="top:${yC-46}px"><span class="label">Reused by</span><b>${total} REF children</b></div>`;
 }else{
  html+=`<div class="row-label" style="top:${yT+th+42}px"><span class="label">Reused by</span><b>nobody yet</b></div>`;
  el('path',{d:`M${cx} ${yT+th} V${yT+th+28}`,class:'stub'},S);
  html+=`<div class="empty-note" style="left:${cx}px;top:${yT+th+40}px">No circuit REFs #${v.id} yet. Reuse with credit shows up here.</div>`;
 }
 T.insertAdjacentHTML('beforeend',html);T.appendChild(target);
 // signal pulses: parents → target, then target → children
 const nP=hasP?Math.min(P.length,MAXN):0;
 pulses.forEach((pts,i)=>pulse(S,pts,{delay:450+i*90,dur:780}));
 setTimeout(()=>target.classList.add('lit'),RM?0:450+nP*90+700);
 if(RM)target.classList.add('lit');
}
// ---------- mobile list ----------
function listTree(v){
 const L=document.getElementById('tlist');const MAXM=5;
 const li=(c,u)=>`<li><span class="mono">#${c.id}</span><span class="nm">${c.name||CLS[c.k]}</span>${u?`<span class="u">×${u}</span>`:''}</li>`;
 let h=`<h4><span class="label">Reuses</span></h4><ul>`;
 h+=v.parents.length?v.parents.slice(0,MAXM).map(p=>li(p[0],p[1])).join('')+(v.parents.length>MAXM?`<li class="more">+${v.parents.length-MAXM} more</li>`:''):`<li class="none">Nothing. Built from scratch.</li>`;
 h+=`</ul><div class="me"><span class="label">This</span><b>#${v.id}</b>${badge(v.k,true)}</div>`;
 if(v.twins)h+=`<h4><span class="label">Same bytes, no REF</span></h4><ul style="border-color:var(--alert)"><li><span class="mono">#${v.twins.orig.id}</span><span class="nm">${v.twins.orig.name}</span><span class="tag orig">Original</span></li></ul>`;
 h+=`<h4><span class="label">Reused by</span></h4><ul>`;
 h+=v.children.length?v.children.slice(0,MAXM).map(c=>`<li><span class="mono">${c[1]!=null?'#'+c[1]:''}</span><span class="nm">${c[0]}</span></li>`).join('')+`<li class="more">+${(v.childrenTotal||v.children.length)-MAXM} more</li>`:`<li class="none">Nobody yet.</li>`;
 h+='</ul>';L.innerHTML=h;
}
// ---------- states ----------
function renderState(page,key){
 document.getElementById('cidIn').value=key==='notfound'?'999':key==='loading'?'5':'5';
 const st={
  loading:`<section class="card span2"><div class="hd" style="padding-bottom:24px"><div class="top"><span class="cidbig"><span>#</span>5</span><span class="sk" style="width:110px;height:28px"></span></div><div class="sk" style="width:60%;height:26px;margin:18px 0 10px"></div><div class="sk" style="width:40%;height:16px"></div></div></section>
   <section class="card span2"><div class="card-h"><h2>Tracing #5 on Cerebr…</h2><span class="label">reading X Layer</span></div><div class="card-b"><div class="scan"></div><p class="foot" style="margin:10px 0 0">Reading the netlist, owner and REFs. Free view calls, nothing is signed.</p></div></section>`,
  notfound:`<section class="card span2 state"><svg width="64" height="64" viewBox="0 0 64 64" fill="none"><rect x="16" y="16" width="32" height="32" rx="4" stroke="var(--silk-3)" stroke-width="1.6" stroke-dasharray="4 4"/><path d="M4 32h12" stroke="var(--copper)" stroke-width="2"/><circle cx="4" cy="32" r="3" stroke="var(--copper)" stroke-width="1.6"/></svg><span class="label">Not found</span><h1>No circuit #999 on Cerebr.</h1><p>The ID may not be taped out yet, or it lives on another processor. Check the processor, then try again.</p><div class="chips"><a class="chip" href="#5"><span class="pin"></span><span class="mono">#5</span> XOR, built from 3 parts</a><a class="chip" href="#34"><span class="pin"></span><span class="mono">#4 vs #34</span> a silent copy</a></div></section>`,
  error:`<section class="card span2 state"><svg width="64" height="64" viewBox="0 0 64 64" fill="none"><path d="M4 32h18M42 32h18" stroke="var(--copper)" stroke-width="2"/><path d="M26 24l12 16M38 24 26 40" stroke="var(--alert)" stroke-width="2" stroke-linecap="round"/></svg><span class="label" style="color:var(--alert)">Can’t reach X Layer</span><h1>The line went quiet.</h1><p>Both public RPC endpoints timed out. Nothing was sent or signed. Your lookup is safe to retry.</p><div class="chips"><button class="btn btn-copper">Try again</button><button class="btn">Copy error details</button></div><span class="foot">rpc.xlayer.tech · xlayerrpc.okx.com</span></section>`};
 page.innerHTML=`<div class="crumbs span2"><span class="foot">Cerebr / state: ${key}</span><span class="ex-tag">State mock</span></div>`+st[key];
}
const key=(location.hash||'#5').slice(1);render(key);
addEventListener('hashchange',()=>render(location.hash.slice(1)));
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>render((location.hash||'#5').slice(1)),150)});
</script>
