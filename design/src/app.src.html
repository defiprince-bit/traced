// ---------- radial lineage ----------
function leavesFor(v,mode){ // mode: 'uses' | 'parents' | 'children'
 if(mode==='children')return v.children.map(c=>({id:c,label:''}));
 if(mode==='parents')return v.parents.map(([id,u])=>({id,label:`×${u} use${u>1?'s':''}`,c:C[id]}));
 const out=[];v.parents.forEach(([id,u])=>{for(let k=1;k<=u;k++)out.push({id,label:`use ${k}/${u}`,c:C[id],grp:id,bare:true})});return out;}
function radial(el,v,mode,opts={}){
 const W=el.clientWidth,H=el.clientHeight;if(!W)return;
 const small=opts.small, orbR=small?78:92, ox=small?110:128, oy=H/2;
 const MAXL=small?8:12;
 let L=leavesFor(v,mode);const total=L.length;let more=0;if(L.length>MAXL){more=L.length-(MAXL-1);L=L.slice(0,MAXL-1);}
 const cats=[{k:'parents',n:v.parents.length,t:'REF parents'},{k:'uses',n:v.r,t:'REF uses'},{k:'children',n:v.children.length,t:'REF children'},{k:'twins',n:v.id===34||v.id===4?1:0,t:'Identical twins'}];
 const catX=ox+orbR+(small?50:50), catW=164, catGap=small?62:70, cy0=oy-(cats.length-1)*catGap/2;
 const leafW=small?190:176, leafH=40, bulge=small?30:44, lx0=W-leafW-bulge-(small?20:64);
 const n=L.length+(more?1:0), span=Math.min(H-140,n*(small?44:52)), y0=oy-span/2;
 let svg=`<svg class="wires" viewBox="0 0 ${W} ${H}">`;let html='';
 // orb
 html+=`<div class="orb" style="left:${ox-orbR}px;top:${oy-orbR}px;width:${orbR*2}px;height:${orbR*2}px"><canvas></canvas><b>#${v.id}</b><span class="on">${v.name?v.name+' · ':''}Cerebr</span></div>`;
 // cats
 cats.forEach((c,i)=>{const y=cy0+i*catGap;const on=c.k===mode;
  svg+=`<path class="${on?'hot':'dim'}" d="M${ox+orbR} ${oy} C${ox+orbR+40} ${oy},${catX-40} ${y},${catX} ${y}"/>`;
  html+=`<div class="cat ${on?'on':''} ${c.n?'':'zero'}" style="left:${catX}px;top:${y-28}px"><b>${c.n}</b><span>${c.t}</span></div>`;});
 const sel=cats.findIndex(c=>c.k===mode), sy=cy0+sel*catGap, sx=catX+catW;
 // leaves
 const paths=[];
 for(let i=0;i<n;i++){const y=n===1?oy:y0+i*(span/(n-1||1));const u=n===1?0:(i/(n-1))*2-1;const x=lx0+bulge*(1-u*u);
  const d=`M${sx} ${sy} C${sx+(x-sx)*.55} ${sy},${sx+(x-sx)*.45} ${y},${x} ${y}`;svg+=`<path class="${i<L.length?'':'dim'}" d="${d}"/>`;paths.push([sx,sy,x,y]);
  if(i<L.length){const f=L[i],c=f.c||C[f.id]||{};html+=`<a class="leaf ${opts.sel===i?'sel':''}" href="#lookup-${f.id}" style="width:${leafW}px;left:${x}px;top:${y-leafH/2}px;--c:var(${CLSV[c.k]||'--lume'});animation-delay:${200+i*35}ms"><span class="sq"></span><b>#${f.id}</b><span>${f.bare?(c.name||''):(c.name||CLS[c.k]||'')}</span><span class="u">${f.label}</span></a>`;}
  else html+=`<div class="leaf more" style="left:${x}px;top:${y-leafH/2}px">+${more} more</div>`;}
 if(!n)html+=`<div class="grp-label" style="left:${sx+40}px;top:${sy-6}px">Nothing here yet</div>`;
 // group labels for uses (bracket on the right)
 if(mode==='uses'&&!small){let i=0;v.parents.forEach(([id,u])=>{const a=i,b=Math.min(i+u-1,L.length-1);if(a<L.length){const ya=y0+a*(span/(n-1)),yb=y0+b*(span/(n-1));const xr=lx0+bulge+leafW+6;
   svg+=`<path class="hot" d="M${xr} ${ya-12} H${xr+6} V${yb+12} H${xr}" style="stroke-width:1"/>`;html+=`<div class="grp-label" style="left:${xr+12}px;top:${(ya+yb)/2-5}px"><b>#${id}</b> ×${u}</div>`;}i+=u;});}
 svg+='</svg>';
 html+=`<div class="rlegend"><span><i></i>REF</span>${EX}</div>`;
 el.innerHTML=svg+html;
 new TraceScene(el.querySelector('.orb canvas'),{cubes:[{x:.5,y:.5,size:.3,state:v.k==='wrapper'?'lume':'lume'}],n:9,trace:false,tilt:false,auto:.4,ambient:6});
 if(!STATIC&&!TRACE_RM){paths.slice(0,L.length).forEach((p,i)=>{const d=document.createElement('i');d.className='pulse-dot';el.appendChild(d);const [ax,ay,bx,by]=p;const t0=performance.now()+i*120;
  const step=now=>{let t=((now-t0)/1400)%1;if(t<0){requestAnimationFrame(step);return}const mt=1-t,c1x=ax+(bx-ax)*.55,c2x=ax+(bx-ax)*.45;
   const x=mt*mt*mt*ax+3*mt*mt*t*c1x+3*mt*t*t*c2x+t*t*t*bx,y=mt*mt*mt*ay+3*mt*mt*t*ay+3*mt*t*t*by+t*t*t*by;d.style.transform=`translate(${x}px,${y}px)`;d.style.opacity=t<.1?t*10:t>.9?(1-t)*10:1;requestAnimationFrame(step)};requestAnimationFrame(step);});}
}
function mobileLineage(v,mode){const L=leavesFor(v,mode==='uses'?'parents':mode);const MAXM=8;
 let h=`<div class="mlist"><div class="mhead"><canvas></canvas><div><b>#${v.id}</b><span class="on">${v.name?v.name+' · ':''}Cerebr</span>${badge(v.k)}</div></div>
 <div class="mcats">${[['parents',v.parents.length,'REF parents'],['uses',v.r,'REF uses'],['children',v.children.length,'REF children']].map(c=>`<div class="cat ${c[0]===mode?'on':''} ${c[1]?'':'zero'}"><b>${c[1]}</b><span>${c[2]}</span></div>`).join('')}</div><div class="mleaves">`;
 if(mode==='uses')h+=`<div class="gl">${v.r} REFs, grouped by parent</div>`;L.slice(0,MAXM).forEach(f=>{const c=f.c||C[f.id];h+=`<a class="leaf" href="#lookup-${f.id}" style="--c:var(${CLSV[c.k]})"><span class="sq"></span><b>#${f.id}</b><span>${c.name||CLS[c.k]}</span><span class="u">${f.label}</span>${mode==='uses'?`<span class="pins">${'<i></i>'.repeat(Math.min(12,+f.label.replace(/\D/g,'')))}</span>`:''}</a>`;});
 if(L.length>MAXM)h+=`<div class="leaf more">+${L.length-MAXM} more</div>`;if(!L.length)h+=`<div class="leaf more" style="color:var(--fg-3)">Nobody yet</div>`;

  <section class="card" aria-label="Lineage"><div class="card-h"><h2>Lineage</h2><span class="label">3 parents · 0 children</span></div><div class="radial small" id="rad"></div>${mobileLineage(v,'parents')}</section>
  <div style="display:flex;flex-direction:column;gap:14px">
   <section class="card"><div class="card-h"><h2>Copy check</h2><span class="label">same bytes · no REF</span></div><div class="verdict clean"><div class="vt">${I.check}No silent copies</div><p>No other indexed circuit has the same netlist bytes as #5.</p></div><div class="card-b"><span class="foot">Matched on keccak256 of the netlist bytes. REF reuse is never a copy.</span></div></section>
   <section class="card"><div class="card-h"><h2>Replay</h2><span class="label">free · in your browser</span></div><div class="card-b"><div class="rp-meta"><span class="cmp">vs <span class="mono">#4</span><span class="foot">you picked: official XOR</span></span><span class="sum">${I.check}4 of 4 match</span></div>${table(5,4,XOR)}</div></section>
   <section class="card"><div class="card-b" style="padding-top:16px">${honest}</div></section>
  </div></div>`;radial(document.getElementById('rad'),v,'parents',{small:true});mhead();},
 'copy-34':m=>{m.innerHTML=top('Copy check','Copy check',34,`<div class="seg"><button class="on">Default</button><button>Advanced</button></div>`)+`<div class="fd">${filters(true)}
  <div class="results"><div style="display:flex;align-items:center;gap:10px"><span class="label">1 finding · Cerebr</span><span style="margin-left:auto">${EX}</span></div>
  <section class="card finding" aria-label="Finding"><div class="card-h"><span class="tag copy">Silent copy</span><h2>#34 is byte-for-byte #4</h2><span class="label">twin group · 2</span></div>
   <div class="verdict copy"><div class="vt">${I.copy}Same netlist, no REF back</div><p>#34’s bytes match the official XOR #4 exactly. Reusing #4 with credit would have changed the bytes.</p></div>
   <div class="twin2"><div class="tw orig"><div class="id"><b>#4</b><span class="tag orig">Likely original</span></div><span class="foot">XOR, official · ${badge('flat')}</span><dl class="kv"><dt>Owner</dt><dd>${short(C[4].o)}</dd><dt>Tape-out</dt><dd><a href="#">${short(C[4].tx)} ↗</a></dd><dt>Block</dt><dd>${num(C[4].block)}</dd></dl></div>
    <div class="eq"><b>=</b><span>same<br>bytes</span></div>
    <div class="tw copy"><div class="id"><b>#34</b><span class="tag copy">Copy</span></div><span class="foot">this lookup · ${badge('flat')}</span><dl class="kv"><dt>Owner</dt><dd>${short(C[34].o)}</dd><dt>Tape-out</dt><dd class="none">Not indexed yet</dd><dt>Block</dt><dd class="none">Unknown</dd></dl></div></div>
   <div class="hashline"><span class="label">Netlist hash, both</span><b>${short(C[4].h)}</b><span>6 NAND · 0 LATCH · 0 REF</span></div>
   <div class="f-actions"><a class="btn btn-lume btn-sm" href="#replay-34">Replay both</a><a class="btn btn-sm" href="#lineage-12">Open lineage</a><span class="foot" style="margin-left:auto;max-width:360px">How we picked the original: lowest ID on the same processor, because #34’s tape-out block isn’t indexed yet.</span></div>
  </section></div></div>`;},
 'findings-empty':m=>{m.innerHTML=top('Copy check','Copy check',5,`<div class="seg"><button class="on">Default</button><button>Advanced</button></div>`)+`<div class="fd">${filters(false)}
  <section class="card results"><div class="empty"><canvas id="sphere" aria-hidden="true"></canvas><span class="label">Copy check · Cerebr #5</span><h2>Nice, no silent copies found.</h2><p>No other indexed circuit shares #5’s netlist bytes. Its 3 REFs are reuse with credit, not copies.</p>
   <div class="seg"><button class="on">Default</button><button>Advanced</button></div><div style="display:flex;gap:6px"><a class="btn btn-lume" href="#lookup-5">New lookup</a><a class="btn" style="width:44px;padding:0" href="#lookup-5" aria-label="New lookup">+</a></div></div></section></div>`;sphere(document.getElementById('sphere'));},
 'replay-34':m=>{m.innerHTML=top('Replay','Replay <span class="mono">#34</span> vs <span class="mono">#4</span>',34)+`<div class="rp-wrap">
  <section class="card rp-big"><div class="card-h"><h2>Truth table</h2><span class="label">2 inputs · 4 rows · free</span></div><div class="card-b">
   <div class="rtiles"><div class="tile hi"><b>4/4</b><span>rows match</span></div><div class="tile"><b>2 → 1</b><span>inputs → output</span></div><div class="tile"><b>0</b><span>transactions sent</span></div></div>
   <div class="rp-meta"><span class="cmp">Run <span class="mono">#34</span></span><span class="cmp">vs <span class="mono">#4</span><span class="foot">twin · likely original</span><svg class="chev" viewBox="0 0 12 12" fill="none"><path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.4"/></svg></span><span class="sum">${I.check}Identical outputs</span></div>
   ${table(34,4,XOR)}<p class="foot" style="margin:12px 0 0">Example values. The app fills this table from live <span class="mono">eval()</span> view calls on X Layer.</p></div></section>
  <aside class="card detail"><div class="k"><span class="tag copy">Silent copy</span><span class="label" style="margin-left:auto">twin of #4</span></div><h3>Same bytes, same answers.</h3><p>Every row of #34 matches #4. That’s expected for byte-identical netlists, and it’s the proof you can rerun yourself.</p>
   <div class="mini"><span class="t"><b>Mismatch style</b>A differing row turns pink and the summary says how many differ.</span><span class="mk fail">${I.x}differs</span></div>${honest}</aside></div>`;},
 'state-loading':m=>{m.innerHTML=top('Lookup','Tracing <span class="mono">#5</span>…',5)+`<section class="card"><div class="hdc" style="padding-bottom:24px"><div class="top"><span class="cidbig"><span>#</span>5</span><span class="sk" style="width:110px;height:26px"></span></div><div class="sk" style="width:58%;height:26px;margin:16px 0 10px"></div><div class="sk" style="width:38%;height:16px"></div></div></section><section class="card"><div class="card-h"><h2>Reading X Layer</h2><span class="label">netlist · owner · REFs</span></div><div class="card-b"><div class="scan"></div><p class="foot" style="margin:10px 0 0">Free view calls. Nothing is signed.</p></div></section>`;},
 'state-notfound':m=>{m.innerHTML=top('Lookup','Lookup',999)+`<section class="card state"><span class="label">Not found</span><h2>No circuit #999 on Cerebr.</h2><p>It may not be taped out yet, or it lives on another processor. Check the processor and try again.</p><div class="chips" style="justify-content:center"><a class="chip" href="#lookup-5"><span class="sq"></span><span class="mono">#5</span> XOR, built from 3 parts</a><a class="chip" href="#copy-34"><span class="sq"></span><span class="mono">#4 vs #34</span> a silent copy</a><a class="chip" href="#lineage-12"><span class="sq"></span><span class="mono">#12</span> 11 REFs</a></div></section>`;},
 'state-error':m=>{m.innerHTML=top('Lookup','Lookup',5)+`<section class="card state"><span class="label" style="color:var(--copy)">Can’t reach X Layer</span><h2>The trace went quiet.</h2><p>Both public RPC endpoints timed out. Nothing was sent or signed, so it’s safe to retry.</p><div style="display:flex;gap:8px"><button class="btn btn-lume">Try again</button><button class="btn">Copy error details</button></div><span class="foot">rpc.xlayer.tech · xlayerrpc.okx.com</span></section>`;},
};
function filters(copy){const r=(t,on,n,ic='')=>`<div class="frow ${on?'on':''}"><span class="bx"></span>${t}${n!=null?`<span class="n">${n}</span>`:''}</div>`;
 return `<aside class="card filters" aria-label="Filters"><div class="fin">Filter…<span class="kbd">F</span></div>
 <div class="fgrp"><span class="label" style="display:block;padding:6px 8px">Verdict</span>${r('Silent copy',copy,copy?1:0)}${r('Likely original',false,copy?1:0)}${r('Identical citations',false,0)}</div>
 <div class="fgrp"><span class="label" style="display:block;padding:6px 8px">Class</span>${r('Toy')}${r('Wrapper',!copy)}${r('Library')}${r('Miner-sized')}${r('Flat',copy)}</div>
 <div class="fgrp"><span class="label" style="display:block;padding:6px 8px">Original picked by</span>${r('Tape-out block')}${r('ID on same processor',copy)}</div>
 <div class="fgrp"><span class="label" style="display:block;padding:6px 8px">Processor</span>${r('Cerebr',true)}</div>
 <div class="fgrp mob">${r('Silent copy',copy)}${r('Likely original')}${r('Cerebr',true)}${r('Flat',copy)}</div></aside>`;}
function mhead(){const c=document.querySelector('.mlist .mhead canvas');if(c&&c.offsetParent)new TraceScene(c,{cubes:[{x:.5,y:.5,size:.3}],n:8,trace:false,tilt:false,auto:.4,ambient:4});}
// wireframe dot sphere (ref2 empty state), Canvas2D
function sphere(cv){const g=cv.getContext('2d'),d=Math.min(2,devicePixelRatio||1);const r=cv.getBoundingClientRect();cv.width=r.width*d;cv.height=r.height*d;g.setTransform(d,0,0,d,0,0);
 const W=r.width,H=r.height,R=W*.38;const pts=[];const lat=14,lon=26;for(let i=1;i<lat;i++)for(let j=0;j<lon;j++){const th=i/lat*Math.PI,ph=j/lon*2*Math.PI;pts.push([Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph),i,j]);}
 const draw=t=>{g.clearRect(0,0,W,H);const a=t*.00015,ca=Math.cos(a),sa=Math.sin(a),tl=.35,ct=Math.cos(tl),st=Math.sin(tl);
  const P=pts.map(p=>{const x=p[0]*ca+p[2]*sa,z=-p[0]*sa+p[2]*ca,y=p[1]*ct-z*st,z2=p[1]*st+z*ct;return[W/2+x*R,H/2+y*R,z2,p[3],p[4]]});
  const idx=(i,j)=>(i-1)*lon+((j+lon)%lon);
  for(const p of P){const q=P[idx(p[3],p[4]+1)],u=p[3]<lat-1?P[idx(p[3]+1,p[4])]:null;const al=p[2]<0?.55:.14;g.strokeStyle=`rgba(200,255,106,${al})`;g.lineWidth=.8;g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);if(u){g.moveTo(p[0],p[1]);g.lineTo(u[0],u[1]);}g.stroke();
   g.fillStyle=`rgba(200,255,106,${p[2]<0?.95:.25})`;g.fillRect(p[0]-1.2,p[1]-1.2,2.4,2.4);}
  // dissolving top cap, like the ref
  if(!(STATIC||TRACE_RM))requestAnimationFrame(draw);};
 requestAnimationFrame(draw);if(STATIC||TRACE_RM)draw(0);}
function render(){const key=(location.hash.replace('#','').split('&')[0])||'lookup-5';const m=document.getElementById('main');(V[key]||V['lookup-5'])(m);
 const view=key.split('-')[0]==='findings'?'copy':key.split('-')[0];document.querySelectorAll('[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===view));}
render();addEventListener('hashchange',render);let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,200)});
})();
</script>
