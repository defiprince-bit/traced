/* Traced design tokens v1 (Douglas direction, 11 Nov 2026): black + lighter acid green.
   Source of truth; mirrored in traced-steering.md. Contrast ratios are against --bg #0B0B0B. */
:root{
  /* surfaces */
  --bg:#0B0B0B;              /* page, app canvas */
  --panel:#111211;           /* sidebar, cards, detail panel */
  --raised:#171917;          /* inputs, nodes, table heads, menus */
  --raised-hi:#1E211E;       /* hover on raised */
  --hairline:#232623;        /* grid lines, card borders */
  --hairline-strong:#343834; /* dividers on raised */
  --hatch:rgba(242,244,239,.05); /* diagonal hatch stroke */
  --crosshair:#5A6058;       /* + marks at grid intersections */
  /* text */
  --fg:#F2F4EF;              /* primary 17.8:1 */
  --fg-2:#A6ABA3;            /* secondary 8.4:1 */
  --fg-3:#7E847C;            /* labels, footnotes 5.1:1 (min 11px mono caps / 12px text) */
  /* accent: Douglas's lighter acid green */
  --lume:#C8FF6A;            /* primary accent, solid button, live traces 16.8:1 */
  --lume-hi:#D9FF94;         /* hover */
  --lume-deep:#9ED93F;       /* pressed, dense voxels */
  --lume-dim:#3E5222;        /* idle traces, empty meter cells (decorative only) */
  --lume-veil:rgba(200,255,106,.10);
  --on-lume:#0B0B0B;         /* text on lume 16.8:1 */
  /* verdicts */
  --orig:#FFC266;            /* likely original 12.3:1 */
  --orig-veil:rgba(255,194,102,.10);
  --copy:#FF6B8B;            /* silent copy, mismatch, error 7.2:1 */
  --copy-veil:rgba(255,107,139,.10);
  --low:#2C302B;             /* logic-0 cell fill */
  /* class badges (Traced heuristics, src/lib/classify.ts) */
  --cls-toy:#A6ABA3; --cls-wrapper:#B9A3FF; --cls-library:#C8FF6A;
  --cls-miner:#FFC266; --cls-composed:#8FB8FF; --cls-flat:#A6ABA3;
  /* type */
  --font-display:"Host Grotesk","Geist",system-ui,sans-serif;
  --font-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --text-2xs:11px; --text-xs:12px; --text-sm:13px; --text-base:15px; --text-md:17px;
  --text-lg:20px; --text-xl:28px; --text-2xl:44px; --text-3xl:56px; --text-hero:72px;
  --leading-tight:1.02; --leading-snug:1.25; --leading-body:1.55;
  --track-display:-.03em; --track-label:.08em;
  /* spacing */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px;
  --s-8:32px; --s-10:40px; --s-12:48px; --s-16:64px; --s-20:80px; --s-30:120px;
  --frame:1280px;            /* landing frame width; hairlines on its edges */
  --grid-cell:48px;          /* hero-panel grid */
  /* radii: square and technical */
  --r-xs:2px; --r-sm:4px; --r-md:8px; --r-lg:12px; --r-xl:18px; --r-pill:999px;
  /* elevation */
  --shadow-panel:inset 0 1px 0 rgba(255,255,255,.03),0 30px 80px -40px rgba(0,0,0,.9);
  --glow-lume:0 0 0 1px rgba(200,255,106,.5),0 0 28px rgba(200,255,106,.16);
  --ring:0 0 0 2px var(--bg),0 0 0 4px var(--lume);
  /* motion: CSS animates opacity + transform only; canvases redraw pixels */
  --d-fast:140ms; --d-base:240ms; --d-slow:600ms; --d-reveal:800ms; --d-count:1200ms;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-trace:cubic-bezier(.45,0,.2,1);
}

/* Traced base + shared components v1 (mock implementation of traced-steering.md) */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--fg);font:400 var(--text-base)/var(--leading-body) var(--font-body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.mono{font-family:var(--font-mono)}
.label{font:500 var(--text-2xs)/1.2 var(--font-mono);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--fg-3)}
.foot{font-size:var(--text-xs);color:var(--fg-3);line-height:1.5}
.g{color:var(--lume)}
.wm{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.wm .mark{width:36px;height:36px;flex:none;display:block;color:var(--lume)}
.wm .wm-text{display:flex;flex-direction:column;justify-content:center;gap:5px}
.wm b{font:600 18px/1 var(--font-display);letter-spacing:-.03em}
.wm small{font:500 var(--text-2xs)/1 var(--font-mono);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--fg-3)}
.wm.compact .mark{width:28px;height:28px}
.wm.compact b{font-size:16px}
/* crosshair mark: put <i class="x"></i> inside a positioned box; .tl/.tr/.bl/.br corners */
.x{position:absolute;width:calc(var(--cross,9px)*2+1px);height:calc(var(--cross,9px)*2+1px);pointer-events:none;z-index:3}
.x::before,.x::after{content:"";position:absolute;background:var(--crosshair)}
.x::before{left:0;right:0;top:50%;height:1px}.x::after{top:0;bottom:0;left:50%;width:1px}
.x.tl{left:-9px;top:-9px}.x.tr{right:-9px;top:-9px}.x.bl{left:-9px;bottom:-9px}.x.br{right:-9px;bottom:-9px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 20px;border-radius:var(--r-xs);border:1px solid var(--hairline-strong);background:transparent;color:var(--fg);font:500 var(--text-sm)/1 var(--font-body);text-decoration:none;cursor:pointer;white-space:nowrap;transition:transform var(--d-fast) var(--ease-out)}
.btn:hover{border-color:var(--fg-3);background:rgba(242,244,239,.04)}
.btn:active{transform:translateY(1px)}
.btn-lume{background:var(--lume);border-color:var(--lume);color:var(--on-lume);font-weight:600}
.btn-lume:hover{background:var(--lume-hi);border-color:var(--lume-hi)}
.btn-sm{height:34px;padding:0 12px;font-size:var(--text-xs)}
.btn-lg{height:52px;padding:0 24px;font-size:var(--text-base)}
.btn:focus-visible,a:focus-visible,input:focus-visible,.chip:focus-visible{outline:none;box-shadow:var(--ring)}
.kbd{font:500 var(--text-2xs)/1 var(--font-mono);padding:4px 6px;border-radius:2px;background:rgba(0,0,0,.14)}
/* mono pill (ref1 "Layer-0 connectivity") */
.mpill{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border:1px solid var(--hairline-strong);background:var(--raised);font:500 var(--text-xs)/1 var(--font-mono);color:var(--fg-2)}
.mpill .cur{width:7px;height:12px;background:var(--lume);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* status label (ref1 "ALL SYSTEMS OPERATIONAL") */
.status{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 10px;border:1px solid rgba(200,255,106,.35);background:var(--lume-veil);font:500 var(--text-2xs)/1 var(--font-mono);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--lume)}
.meter{display:inline-flex;gap:3px;height:24px;align-items:center;padding:0 8px;border:1px solid rgba(200,255,106,.35);background:var(--lume-veil)}
.meter i{width:3px;height:10px;background:var(--lume)}
.meter i.off{background:var(--lume-dim)}
/* CID lookup bar */
.lookup{display:flex;align-items:stretch;border:1px solid var(--hairline-strong);background:var(--raised);padding:4px}
.lookup .proc{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 14px 0 10px;border-right:1px solid var(--hairline);min-width:180px;cursor:pointer}
.lookup .proc .v{display:flex;align-items:center;gap:8px;font:500 var(--text-base)/1 var(--font-body)}
.lookup .proc .v .mono{font-size:var(--text-xs);color:var(--fg-3);font-weight:400}
.lookup .cid{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:0 14px}
.lookup .cid .hash{font:500 22px/1 var(--font-mono);color:var(--lume)}
.lookup .cid input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--fg);font:500 20px/1 var(--font-mono);outline:none}
.lookup .cid input::placeholder{color:var(--fg-3);font-weight:400}
.chev{width:12px;height:12px;color:var(--fg-3);flex:none}
/* example chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--hairline-strong);background:var(--panel);color:var(--fg-2);font-size:var(--text-sm);text-decoration:none;transition:transform var(--d-fast) var(--ease-out)}
.chip:hover{border-color:var(--lume);color:var(--fg);transform:translateY(-1px)}
.chip .mono{color:var(--lume);font-weight:600}
.chip .sq{width:6px;height:6px;background:var(--lume)}
/* class badges: a tiny DIP package */
.badge{--c:var(--cls-flat);display:inline-flex;align-items:center;gap:9px;height:26px;padding:0 10px 0 9px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 9%,transparent);color:var(--c);font:600 var(--text-2xs)/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.badge .pkg{position:relative;width:10px;height:12px;background:var(--c)}
.badge .pkg::before,.badge .pkg::after{content:"";position:absolute;top:1px;bottom:1px;width:2px;background:repeating-linear-gradient(var(--c) 0 2px,transparent 2px 4px)}
.badge .pkg::before{left:-4px}.badge .pkg::after{right:-4px}
.badge.toy{--c:var(--cls-toy)}.badge.wrapper{--c:var(--cls-wrapper)}.badge.library{--c:var(--cls-library)}
.badge.miner{--c:var(--cls-miner)}.badge.composed{--c:var(--cls-composed)}.badge.flat{--c:var(--cls-flat);border-style:dashed}
/* verdict tags */
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;font:600 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;border:1px solid}
.tag.orig{color:var(--orig);background:var(--orig-veil);border-color:rgba(255,194,102,.45)}
.tag.copy{color:var(--copy);background:var(--copy-veil);border-color:rgba(255,107,139,.45)}
.tag.ok{color:var(--lume);background:var(--lume-veil);border-color:rgba(200,255,106,.4)}
.tag.ex{color:var(--fg-3);border:1px dashed var(--hairline-strong);background:transparent}
/* truth-table bits + marks */
.bit{display:inline-grid;place-items:center;width:28px;height:28px;font:600 var(--text-sm)/1 var(--font-mono);background:var(--low);color:var(--fg-3)}
.bit.on{background:var(--lume-veil);color:var(--lume);box-shadow:inset 0 0 0 1px rgba(200,255,106,.45)}
.mk{display:inline-flex;align-items:center;gap:6px;font:600 var(--text-xs)/1 var(--font-mono)}
.mk.pass{color:var(--lume)}.mk.fail{color:var(--copy)}
.mk svg{width:14px;height:14px}
/* reveal on scroll */
.rv{opacity:0;transform:translateY(24px);transition:opacity var(--d-reveal) var(--ease-out),transform var(--d-reveal) var(--ease-out)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
html.static .rv{opacity:1;transform:none;transition:none}
/* shot mode (#…&shot): final states without waiting, for headless screenshots only */
html.shot *,html.shot *::before,html.shot *::after{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important;transition-delay:0s!important}

</style>
<style>
html,body{height:100%}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(200,255,106,.06),transparent 60%),var(--bg)}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:12px;min-height:100vh;padding:12px}
/* sidebar */
.side{position:sticky;top:12px;height:calc(100vh - 24px);display:flex;flex-direction:column;gap:6px;padding:18px 14px;border:1px solid var(--hairline);border-radius:var(--r-xl);background:var(--panel)}
.side .wm{padding:2px 6px 14px}
.newl{display:flex;gap:6px;margin-bottom:14px}.newl .btn{flex:1;height:38px}.newl .btn.sq{flex:none;width:38px;padding:0}
.navi{display:flex;align-items:center;gap:12px;height:38px;padding:0 10px;border-radius:var(--r-md);color:var(--fg-2);text-decoration:none;font-size:var(--text-sm);position:relative}
.navi svg{width:16px;height:16px;flex:none}
.navi:hover{background:var(--raised);color:var(--fg)}
.navi.on{background:var(--raised);color:var(--fg)}
.navi.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:2px;background:var(--lume)}
.navi .ct{margin-left:auto;font:500 var(--text-2xs)/1 var(--font-mono);color:var(--fg-3)}
.proc-box{margin-top:14px;padding:12px;border:1px solid var(--hairline);border-radius:var(--r-md);display:flex;flex-direction:column;gap:6px}
.proc-box b{font-weight:500}
.proc-box .mono{font-size:var(--text-xs);color:var(--fg-3)}
.side .bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.live{display:flex;align-items:center;gap:8px;padding:10px;font:500 var(--text-2xs)/1 var(--font-mono);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--fg-3)}
.live i{width:7px;height:7px;background:var(--lume)}
/* main */
.main{min-width:0;display:flex;flex-direction:column;gap:14px;padding:8px 8px 24px}
.topb{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:8px;font-size:var(--text-xs);color:var(--fg-3)}
.crumb svg{width:13px;height:13px}
.titlerow{display:flex;align-items:center;gap:16px;width:100%}
.titlerow h1{font-size:var(--text-xl);letter-spacing:-.025em}
.titlerow h1 .mono{color:var(--lume);font-weight:500}
.titlerow .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.main .lookup{padding:3px;min-width:420px}
.main .lookup .proc{min-width:150px;gap:3px}.main .lookup .proc .v{font-size:var(--text-sm)}
.main .lookup .cid .hash{font-size:17px}.main .lookup .cid input{font-size:16px}.main .lookup .btn{height:36px}
.seg{display:inline-flex;border:1px solid var(--hairline-strong);background:var(--raised);padding:2px}
.seg button{height:30px;padding:0 12px;border:0;background:transparent;font:500 var(--text-xs)/1 var(--font-body);color:var(--fg-3);cursor:pointer}
.seg button.on{background:var(--raised-hi);color:var(--fg);box-shadow:inset 0 0 0 1px var(--hairline-strong)}
.seg button svg{width:14px;height:14px;vertical-align:-2px}
.exnote{display:inline-flex}
/* cards */
.card{position:relative;border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--panel)}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 20px 0}
.card-h h2{font:500 var(--text-lg)/1.1 var(--font-display);letter-spacing:-.015em}
.card-h .label{margin-left:auto}
.card-b{padding:14px 20px 20px}
/* lineage radial */
.lin-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;min-height:calc(100vh - 130px)}
.radial{position:relative;overflow:hidden;min-height:640px;background-image:radial-gradient(circle at 1px 1px,rgba(242,244,239,.06) 1px,transparent 1.5px);background-size:24px 24px}
.radial svg.wires{position:absolute;inset:0;width:100%;height:100%}
.wires path{fill:none;stroke:rgba(200,255,106,.28);stroke-width:1.2}
.wires path.hot{stroke:rgba(200,255,106,.75);stroke-width:1.4}
.wires path.dim{stroke:rgba(166,171,163,.18)}
.orb{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(200,255,106,.10),rgba(17,18,17,.9) 62%);border:1px solid rgba(200,255,106,.35);box-shadow:0 0 0 14px rgba(200,255,106,.03),0 0 0 28px rgba(200,255,106,.02),0 0 80px rgba(200,255,106,.12)}
.orb canvas{width:120px;height:110px;margin-top:-6px}
.orb b{font:600 28px/1 var(--font-mono);letter-spacing:-.02em}
.orb .on{font-size:var(--text-xs);color:var(--fg-3);margin-top:4px}
.orb .badge{margin-top:10px}
.cat{position:absolute;display:flex;align-items:center;gap:12px;width:164px;height:56px;padding:0 14px;border:1px solid var(--hairline-strong);border-radius:var(--r-md);background:var(--raised);cursor:pointer;transition:transform var(--d-fast) var(--ease-out)}
.cat b{font:500 22px/1 var(--font-display);letter-spacing:-.02em;min-width:28px}
.cat span{font-size:var(--text-xs);color:var(--fg-2);line-height:1.25}
.cat:hover{transform:translateX(2px)}
.cat.on{border-color:var(--lume);box-shadow:var(--glow-lume);background:linear-gradient(90deg,var(--lume-veil),transparent),var(--raised)}
.cat.on b{color:var(--lume)}
.cat.zero{opacity:.55}
.leaf{position:absolute;display:flex;align-items:center;gap:10px;width:176px;height:40px;padding:0 10px;border:1px solid var(--hairline-strong);border-radius:var(--r-sm);background:rgba(23,25,23,.92);text-decoration:none;color:var(--fg);transition:transform var(--d-fast) var(--ease-out);opacity:0;animation:fadeIn var(--d-slow) var(--ease-out) forwards}
.leaf:hover{border-color:var(--lume);transform:translateX(3px)}
.leaf .sq{width:8px;height:8px;background:var(--c,var(--lume));flex:none}
.leaf b{font:600 var(--text-sm)/1 var(--font-mono)}
.leaf span{font-size:var(--text-xs);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaf .u{margin-left:auto;font:500 var(--text-2xs)/1 var(--font-mono);color:var(--fg-3)}
.leaf.sel{border-color:var(--lume);background:linear-gradient(90deg,var(--lume-veil),transparent),var(--raised)}
.leaf.more{border-style:dashed;background:transparent;color:var(--lume);justify-content:center;font-size:var(--text-sm)}
.grp-label{position:absolute;font:500 var(--text-2xs)/1 var(--font-mono);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--fg-3);white-space:nowrap}
.grp-label b{color:var(--lume);font-weight:600}
.rlegend{position:absolute;left:20px;bottom:16px;display:flex;gap:16px;align-items:center}
.rlegend span{display:inline-flex;align-items:center;gap:8px;font-size:var(--text-xs);color:var(--fg-3)}
.rlegend i{width:18px;height:1.5px;background:var(--lume)}
.pulse-dot{position:absolute;left:0;top:0;opacity:0;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;background:var(--lume);box-shadow:0 0 8px var(--lume);pointer-events:none}
@keyframes fadeIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
/* detail panel (ref3 right) */
.detail{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:var(--r-xl);overflow:auto}
.detail .k{display:flex;align-items:center;gap:8px}
.detail h2{font:500 40px/1 var(--font-mono);letter-spacing:-.03em;margin:6px 0 0}
.detail h3{font:500 var(--text-lg)/1.25 var(--font-display);letter-spacing:-.015em;margin:0}
.detail p{margin:0;color:var(--fg-2);font-size:var(--text-sm)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{padding:14px;border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--raised)}
.tile b{display:block;font:500 28px/1 var(--font-display);letter-spacing:-.03em}
.tile span{display:block;margin-top:6px;font-size:var(--text-xs);color:var(--fg-3)}
.tile.hi{border-color:rgba(200,255,106,.4);background:linear-gradient(180deg,var(--lume-veil),transparent),var(--raised)}.tile.hi b{color:var(--lume)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:0;padding:12px 0;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline)}
.kv dt{font:500 var(--text-2xs)/1.6 var(--font-mono);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--fg-3)}
.kv dd{margin:0;font:500 var(--text-sm)/1.5 var(--font-mono);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv dd a{color:var(--lume);text-decoration:none}
.kv dd.none{color:var(--fg-3);font-family:var(--font-body)}
.mini{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--hairline);border-radius:var(--r-md)}
.mini .t{flex:1;font-size:var(--text-sm);color:var(--fg-2)}
.mini .t b{display:block;color:var(--fg);font-weight:500}
.honest{display:flex;gap:12px;padding:12px;border-radius:var(--r-md);background:var(--raised);font-size:var(--text-xs);color:var(--fg-2);line-height:1.5}
.honest svg{flex:none;width:18px;height:18px;color:var(--fg-3);margin-top:1px}
/* overview (lookup) */
.ov{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.ov .span2{grid-column:1/-1}
.hdc{padding:22px 24px 0}
.hdc .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hdc .cidbig{font:600 44px/1 var(--font-mono);letter-spacing:-.03em}.hdc .cidbig span{color:var(--lume)}
.hdc .on{font-size:var(--text-sm);color:var(--fg-3)}
.hdc h2{font:500 var(--text-xl)/1.15 var(--font-display);letter-spacing:-.025em;margin:14px 0 6px;max-width:780px}
.hdc p{margin:0;color:var(--fg-2);max-width:700px}
.facts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:20px;border-top:1px solid var(--hairline)}
.fact{padding:14px 14px 18px 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.fact+.fact{padding-left:14px;border-left:1px solid var(--hairline)}
.fact .v{font:500 var(--text-sm)/1.3 var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fact .v a{color:var(--lume);text-decoration:none}
.fact .v2{font:400 var(--text-xs)/1.2 var(--font-mono);color:var(--fg-3);white-space:nowrap}
.fact .v.none{color:var(--fg-3);font-family:var(--font-body)}
.radial.small{min-height:380px;border-radius:0 0 var(--r-lg) var(--r-lg)}
/* verdicts */
.verdict{position:relative;margin:14px 20px 0;padding:14px 14px 14px 18px;border-radius:var(--r-md);border:1px solid var(--hairline);background:var(--raised);overflow:hidden}
.verdict::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--vc,var(--fg-3))}
.verdict .vt{display:flex;align-items:center;gap:10px;font:600 var(--text-md)/1.2 var(--font-body);color:var(--vc,var(--fg))}
.verdict .vt svg{width:18px;height:18px;flex:none}
.verdict p{margin:6px 0 0;color:var(--fg-2);font-size:var(--text-sm)}
.verdict.copy{--vc:var(--copy);background:linear-gradient(90deg,var(--copy-veil),transparent 70%),var(--raised);border-color:rgba(255,107,139,.35)}
.verdict.orig{--vc:var(--orig);background:linear-gradient(90deg,var(--orig-veil),transparent 70%),var(--raised);border-color:rgba(255,194,102,.35)}
.verdict.clean{--vc:var(--lume)}
/* replay table */
.rp-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cmp{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--hairline-strong);background:var(--raised);font-size:var(--text-sm)}
.cmp .mono{color:var(--lume);font-weight:600}
.sum{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;background:var(--lume-veil);border:1px solid rgba(200,255,106,.4);color:var(--lume);font:600 var(--text-sm)/1 var(--font-mono)}
.sum svg{width:16px;height:16px}
table.tt{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.tt th{font:500 var(--text-2xs)/1 var(--font-mono);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--fg-3);text-align:center;padding:10px 6px;border-bottom:1px solid var(--hairline);background:var(--raised)}
.tt th.g2,.tt td.g2{border-left:1px solid var(--hairline)}
.tt td{text-align:center;padding:7px 6px;border-bottom:1px solid var(--hairline)}
.tt tbody tr{opacity:0;animation:fadeIn var(--d-base) var(--ease-out) forwards}
html.static .tt tbody tr,html.static .leaf{opacity:1;animation:none}

.fd{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;min-height:calc(100vh - 130px)}
.filters{padding:12px;display:flex;flex-direction:column;gap:2px;align-self:start}
.filters .fin{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 10px;margin-bottom:8px;border:1px solid var(--hairline-strong);background:var(--raised);font-size:var(--text-sm);color:var(--fg-3)}
.filters .fin .kbd{background:var(--raised-hi);color:var(--fg-2)}
.fgrp{padding:6px 0;border-top:1px solid var(--hairline)}
.fgrp:first-of-type{border-top:0}
.frow{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:var(--r-sm);font-size:var(--text-sm);color:var(--fg-2)}
.frow svg{width:14px;height:14px;color:var(--fg-3)}
.frow .bx{width:14px;height:14px;border:1px solid var(--hairline-strong);flex:none}
.frow.on{color:var(--fg);background:var(--raised)}.frow.on .bx{background:var(--lume);border-color:var(--lume);box-shadow:inset 0 0 0 3px var(--raised)}
.frow .n{margin-left:auto;font:500 var(--text-2xs)/1 var(--font-mono);color:var(--fg-3)}
.results{display:flex;flex-direction:column;gap:14px;min-width:0}
.finding{padding:0 0 18px}
.twin2{display:grid;grid-template-columns:1fr 56px 1fr;align-items:stretch;margin:16px 20px 0}
.tw{padding:16px;border:1px solid var(--hairline-strong);border-radius:var(--r-md);background:var(--raised);display:flex;flex-direction:column;gap:10px;min-width:0}
.tw.orig{border-color:rgba(255,194,102,.5);background:linear-gradient(180deg,var(--orig-veil),transparent 60%),var(--raised)}
.tw.copy{border-color:rgba(255,107,139,.5);background:linear-gradient(180deg,var(--copy-veil),transparent 60%),var(--raised)}
.tw .id{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tw .id b{font:600 32px/1 var(--font-mono);letter-spacing:-.03em}
.tw .kv{border:0;padding:0}
.eq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--fg-3)}
.eq b{font:500 28px/1 var(--font-mono);color:var(--fg-2)}
.eq span{font:500 9px/1.2 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;text-align:center}
.hashline{margin:12px 20px 0;padding:10px 12px;border:1px dashed var(--hairline-strong);display:flex;gap:10px;align-items:center;font:500 var(--text-xs)/1.4 var(--font-mono);color:var(--fg-2);flex-wrap:wrap}

.f-actions{display:flex;gap:8px;margin:14px 20px 0;flex-wrap:wrap;align-items:center}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:40px 20px}
.empty canvas{width:360px;height:360px}
.empty h2{font:500 var(--text-xl)/1.1 var(--font-display);letter-spacing:-.02em}
.empty p{margin:0;color:var(--fg-2);max-width:440px}
/* replay page */
.rp-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}
.rtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.rp-big .bit{width:34px;height:34px;font-size:var(--text-md)}
.rp-big .tt td{padding:10px 6px}
/* states */
.state{padding:64px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.state h2{font:500 var(--text-xl)/1.15 var(--font-display);letter-spacing:-.02em}

.sk{background:var(--raised);animation:skp 1.4s ease-in-out infinite}
@keyframes skp{50%{opacity:.4}}
.scan{position:relative;height:200px;overflow:hidden;border:1px solid var(--hairline);background-image:radial-gradient(circle at 1px 1px,rgba(242,244,239,.06) 1px,transparent 1.5px);background-size:24px 24px}

@keyframes scan{from{transform:translateX(-160px)}to{transform:translateX(1400px)}}
/* mobile list lineage */
.mlist{display:none}
.fgrp.mob{display:none}
.tabbar{display:none}
.mtop{display:none}
@media (max-width:1180px){.lin-wrap,.rp-wrap{grid-template-columns:1fr}.facts{grid-template-columns:repeat(3,1fr)}.ov{grid-template-columns:1fr}}

   <div class="mini"><span class="t"><b>Mismatch style</b>A differing row turns pink and the summary says how many differ.</span><span class="mk fail">${I.x}differs</span></div>${honest}</aside></div>`;},
 'state-loading':m=>{m.innerHTML=top('Lookup','Tracing <span class="mono">#5</span>…',5)+`<section class="card"><div class="hdc" style="padding-bottom:24px"><div class="top"><span class="cidbig"><span>#</span>5</span><span class="sk" style="width:110px;height:26px"></span></div><div class="sk" style="width:58%;height:26px;margin:16px 0 10px"></div><div class="sk" style="width:38%;height:16px"></div></div></section><section class="card"><div class="card-h"><h2>Reading X Layer</h2><span class="label">netlist · owner · REFs</span></div><div class="card-b"><div class="scan"></div><p class="foot" style="margin:10px 0 0">Free view calls. Nothing is signed.</p></div></section>`;},
 'state-notfound':m=>{m.innerHTML=top('Lookup','Lookup',999)+`<section class="card state"><span class="label">Not found</span><h2>No circuit #999 on Cerebr.</h2><p>It may not be taped out yet, or it lives on another processor. Check the processor and try again.</p><div class="chips" style="justify-content:center"><a class="chip" href="#lookup-5"><span class="sq"></span><span class="mono">#5</span> XOR, built from 3 parts</a><a class="chip" href="#copy-34"><span class="sq"></span><span class="mono">#4 vs #34</span> a silent copy</a><a class="chip" href="#lineage-12"><span class="sq"></span><span class="mono">#12</span> 11 REFs</a></div></section>`;},
 'state-error':m=>{m.innerHTML=top('Lookup','Lookup',5)+`<section class="card state"><span class="label" style="color:var(--copy)">Can’t reach X Layer</span><h2>The trace went quiet.</h2><p>Both public RPC endpoints timed out. Nothing was sent or signed, so it’s safe to retry.</p><div style="display:flex;gap:8px"><button class="btn btn-lume">Try again</button><button class="btn">Copy error details</button></div><span class="foot">rpc.xlayer.tech · xlayerrpc.okx.com</span></section>`;},
};
function filters(copy){const r=(t,on,n,ic='')=>`<div class="frow ${on?'on':''}"><span class="bx"></span>${t}${n!=null?`<span class="n">${n}</span>`:''}</div>`;
 return `<aside class="card filters" aria-label="Filters"><div class="fin">Filter…<span class="kbd">F</span></div>
 <div class="fgrp"><span class="label" style="display:block;padding:6px 8px">Verdict</span>${r('Silent copy',copy,copy?1:0)}${r('Likely original',false,copy?1:0)}${r('Identical citations',false,0)}</div>
 <div class="fgrp"><span class="label" style="display:block;padding:6px 8px">Class</span>${r('Toy')}${r('Wrapper',!copy)}${r('Library')}${r('Miner-sized')}${r('Flat',copy)}</div>
 <div class="fgrp"><span class="label" style="display:block;padding:6px 8px">Original picked by</span>${r('Tape-out block')}${r('ID on same processor',copy)}</div>
 <div class="fgrp"><span class="label" style="display:block;padding:6px 8px">Processor</span>${r('Cerebr',true)}</div>
 <div class="fgrp mob">${r('Silent copy',copy)}${r('Likely original')}${r('Cerebr',true)}${r('Flat',copy)}</div></aside>`;}
function mhead(){const c=document.querySelector('.mlist .mhead canvas');if(c&&c.offsetParent)new TraceScene(c,{cubes:[{x:.5,y:.5,size:.3}],n:8,trace:false,tilt:false,auto:.4,ambient:4});}
// wireframe dot sphere (ref2 empty state), Canvas2D
function sphere(cv){const g=cv.getContext('2d'),d=Math.min(2,devicePixelRatio||1);const r=cv.getBoundingClientRect();cv.width=r.width*d;cv.height=r.height*d;g.setTransform(d,0,0,d,0,0);
 const W=r.width,H=r.height,R=W*.38;const pts=[];const lat=14,lon=26;for(let i=1;i<lat;i++)for(let j=0;j<lon;j++){const th=i/lat*Math.PI,ph=j/lon*2*Math.PI;pts.push([Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph),i,j]);}
 const draw=t=>{g.clearRect(0,0,W,H);const a=t*.00015,ca=Math.cos(a),sa=Math.sin(a),tl=.35,ct=Math.cos(tl),st=Math.sin(tl);
  const P=pts.map(p=>{const x=p[0]*ca+p[2]*sa,z=-p[0]*sa+p[2]*ca,y=p[1]*ct-z*st,z2=p[1]*st+z*ct;return[W/2+x*R,H/2+y*R,z2,p[3],p[4]]});
  const idx=(i,j)=>(i-1)*lon+((j+lon)%lon);
  for(const p of P){const q=P[idx(p[3],p[4]+1)],u=p[3]<lat-1?P[idx(p[3]+1,p[4])]:null;const al=p[2]<0?.55:.14;g.strokeStyle=`rgba(200,255,106,${al})`;g.lineWidth=.8;g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);if(u){g.moveTo(p[0],p[1]);g.lineTo(u[0],u[1]);}g.stroke();
   g.fillStyle=`rgba(200,255,106,${p[2]<0?.95:.25})`;g.fillRect(p[0]-1.2,p[1]-1.2,2.4,2.4);}
  // dissolving top cap, like the ref
  if(!(STATIC||TRACE_RM))requestAnimationFrame(draw);};
 requestAnimationFrame(draw);if(STATIC||TRACE_RM)draw(0);}
function render(){const key=(location.hash.replace('#','').split('&')[0])||'lookup-5';const m=document.getElementById('main');(V[key]||V['lookup-5'])(m);
 const view=key.split('-')[0]==='findings'?'copy':key.split('-')[0];document.querySelectorAll('[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===view));}
render();addEventListener('hashchange',render);let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,200)});
})();
</script>
